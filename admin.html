<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel de turnos | Black Label</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#111111">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script>(function(){var t;try{t=localStorage.getItem("tema")}catch(e){}if(t!=="light"&&t!=="dark")t=window.matchMedia&&matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";document.documentElement.dataset.theme=t})();</script>
</head>
<body class="page-admin">

  <!-- LOGIN -->
  <section class="login" id="vistaLogin" hidden>
    <form class="login__card" id="formLogin" novalidate>
      <button type="button" class="icon-btn theme-toggle" data-theme-toggle aria-label="Cambiar tema"><i data-lucide="sun" class="ico-sun"></i><i data-lucide="moon" class="ico-moon"></i></button>
      <a href="./" class="logo"><i data-lucide="scissors"></i><span>BLACK <b>LABEL</b></span></a>
      <h1>Panel de turnos</h1>
      <label class="field" id="campoEmail">
        <span>Email</span>
        <input name="email" type="email" autocomplete="username" placeholder="admin@tubarberia.com">
      </label>
      <label class="field">
        <span>Contraseña</span>
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <p class="note" id="loginHint" hidden>Modo demo: la contraseña es <b>admin</b></p>
      <p class="form__error" id="loginError" role="alert" hidden></p>
      <button class="btn btn--gold btn--block" type="submit"><i data-lucide="log-in"></i>INGRESAR</button>
    </form>
  </section>

  <!-- PANEL -->
  <div id="vistaPanel" hidden>
    <header class="topbar">
      <div class="container container--wide topbar__inner">
        <a href="./" class="logo" title="Ver página de reservas"><i data-lucide="scissors"></i><span>BLACK <b>LABEL</b></span></a>
        <div class="topbar__right">
          <span class="badge" id="modoBadge"></span>
          <button type="button" class="icon-btn theme-toggle" data-theme-toggle aria-label="Cambiar tema"><i data-lucide="sun" class="ico-sun"></i><i data-lucide="moon" class="ico-moon"></i></button>
          <button class="btn btn--ghost btn--sm" id="btnBarberos"><i data-lucide="users"></i><span class="hide-sm">Barberos</span> <span class="count" id="cantBarberos"></span></button>
          <button class="btn btn--ghost btn--sm" id="btnServicios"><i data-lucide="scissors"></i><span class="hide-sm">Servicios</span> <span class="count" id="cantServicios"></span></button>
          <button class="btn btn--ghost btn--sm" id="btnSalir"><i data-lucide="log-out"></i><span class="hide-sm">Salir</span></button>
        </div>
      </div>
    </header>

    <main class="container container--wide admin" id="main">
      <div class="toolbar">
        <div class="datenav">
          <button class="icon-btn" id="diaPrev" aria-label="Día anterior"><i data-lucide="chevron-left"></i></button>
          <label class="datenav__label">
            <strong id="diaTexto"></strong>
            <input type="date" id="diaInput" aria-label="Elegir fecha">
          </label>
          <button class="icon-btn" id="diaNext" aria-label="Día siguiente"><i data-lucide="chevron-right"></i></button>
          <button class="btn btn--ghost btn--sm" id="diaHoy">Hoy</button>
        </div>
        <div class="toolbar__right">
          <select id="filtroBarbero" class="select" aria-label="Filtrar por barbero"><option value="">Todos los barberos</option></select>
          <div class="segmented" role="tablist" aria-label="Vista">
            <button role="tab" data-vista="agenda" aria-selected="true"><i data-lucide="calendar-range"></i><span class="hide-sm">Agenda</span></button>
            <button role="tab" data-vista="lista" aria-selected="false"><i data-lucide="list"></i><span class="hide-sm">Lista</span></button>
          </div>
          <button class="btn btn--gold btn--sm" id="btnNuevo"><i data-lucide="plus"></i>Nuevo turno</button>
        </div>
      </div>

      <section class="kpis" id="kpis" aria-label="Resumen del día"></section>

      <section id="agenda" class="agenda" aria-label="Agenda del día"></section>
      <section id="lista" class="tabla-wrap" aria-label="Lista de turnos" hidden></section>
    </main>
  </div>

  <!-- DETALLE DE TURNO -->
  <dialog class="modal" id="modalDetalle">
    <div class="modal__head">
      <h2 id="detTitulo">Turno</h2>
      <button class="icon-btn" data-close aria-label="Cerrar"><i data-lucide="x"></i></button>
    </div>
    <div id="detCuerpo"></div>
  </dialog>

  <!-- BARBEROS -->
  <dialog class="modal modal--wide" id="modalBarberos">
    <div class="modal__head">
      <div>
        <h2>Barberos del local</h2>
        <p class="note" id="barberosResumen" style="margin:0"></p>
      </div>
      <button class="icon-btn" data-close aria-label="Cerrar"><i data-lucide="x"></i></button>
    </div>
    <ul class="staff" id="listaStaff"></ul>
    <form id="formBarbero" class="form staff__form" novalidate>
      <h3 id="formBarberoTitulo">Agregar barbero</h3>
      <input type="hidden" name="id">
      <div class="grid-2">
        <label class="field"><span>Nombre</span><input name="nombre" required minlength="2" maxlength="40" autocomplete="off" placeholder="Ej: Diego"></label>
        <label class="field"><span>Especialidad <small>(opcional)</small></span><input name="especialidad" maxlength="60" autocomplete="off" placeholder="Ej: Fades y diseños"></label>
      </div>
      <label class="field"><span>Foto <small>(URL opcional)</small></span><input name="foto" type="url" placeholder="https://…"></label>
      <p class="form__error" id="barberoError" role="alert" hidden></p>
      <div class="staff__formbtns">
        <button class="btn btn--gold btn--sm" type="submit" id="btnGuardarBarbero"><i data-lucide="user-plus"></i>Agregar</button>
        <button class="btn btn--text btn--sm" type="button" id="btnCancelarEdicion" hidden>Cancelar edición</button>
      </div>
    </form>
  </dialog>

  <!-- SERVICIOS -->
  <dialog class="modal modal--wide" id="modalServicios">
    <div class="modal__head">
      <div>
        <h2>Servicios</h2>
        <p class="note" id="serviciosResumen" style="margin:0"></p>
      </div>
      <button class="icon-btn" data-close aria-label="Cerrar"><i data-lucide="x"></i></button>
    </div>
    <ul class="staff" id="listaServ"></ul>
    <form id="formServicio" class="form staff__form" novalidate>
      <h3 id="formServicioTitulo">Agregar servicio</h3>
      <input type="hidden" name="id">
      <label class="field"><span>Nombre</span><input name="nombre" required minlength="2" maxlength="60" autocomplete="off" placeholder="Ej: Corte clásico"></label>
      <label class="field"><span>Descripción <small>(opcional)</small></span><input name="descripcion" maxlength="120" autocomplete="off" placeholder="Ej: Tijera y máquina, lavado incluido."></label>
      <div class="grid-2">
        <label class="field"><span>Duración</span><select name="duracion" class="select" required></select></label>
        <label class="field"><span>Precio (Gs.)</span><input name="precio" type="number" inputmode="numeric" required min="0" max="99999999" step="1000" placeholder="Ej: 50000"></label>
      </div>
      <p class="form__error" id="servicioError" role="alert" hidden></p>
      <div class="staff__formbtns">
        <button class="btn btn--gold btn--sm" type="submit" id="btnGuardarServicio"><i data-lucide="plus"></i>Agregar</button>
        <button class="btn btn--text btn--sm" type="button" id="btnCancelarServicio" hidden>Cancelar edición</button>
      </div>
    </form>
  </dialog>

  <!-- NUEVO TURNO -->
  <dialog class="modal" id="modalNuevo">
    <form id="formNuevo" class="form" novalidate>
      <div class="modal__head">
        <h2>Nuevo turno</h2>
        <button type="button" class="icon-btn" data-close aria-label="Cerrar"><i data-lucide="x"></i></button>
      </div>
      <fieldset class="field checks-field">
        <legend>Servicios <small>(uno o varios)</small></legend>
        <div class="checks" id="nuevoServicios"></div>
        <p class="checks__total" id="nuevoTotal"></p>
      </fieldset>
      <div class="grid-2">
        <label class="field" style="grid-column:1/-1"><span>Barbero</span><select name="barbero_id" class="select" required></select></label>
        <label class="field"><span>Fecha</span><input name="fecha" type="date" required></label>
        <label class="field"><span>Hora</span><select name="hora" class="select" required></select></label>
        <label class="field"><span>Cliente</span><input name="cliente_nombre" required minlength="2" maxlength="80" autocomplete="off"></label>
        <label class="field"><span>Celular</span><input name="cliente_telefono" type="tel" required pattern="[0-9 +()-]{6,20}" autocomplete="off"></label>
      </div>
      <label class="field"><span>Nota <small>(opcional)</small></span><textarea name="nota" rows="2" maxlength="300"></textarea></label>
      <p class="form__error" id="nuevoError" role="alert" hidden></p>
      <button class="btn btn--gold btn--block" type="submit"><i data-lucide="calendar-plus"></i>GUARDAR TURNO</button>
    </form>
  </dialog>

  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/db.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
